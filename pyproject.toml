[project]
name = "scenario-lab"
version = "0.1.0"
description = "Neural SDEs for interest-rate scenario generation and liability risk"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "jupyter", "requests"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenario_lab"]
